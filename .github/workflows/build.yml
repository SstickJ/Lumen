name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # No setup-android step: ubuntu-latest already has the Android SDK (ANDROID_HOME)
      # with licenses accepted, and AGP downloads the platform/build-tools it needs.
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Diagnose project layout
        continue-on-error: true
        run: |
          echo "--- repo root"; ls -la
          echo "--- app/"; ls -la app || true
          echo "--- app/build.gradle.kts (head)"; head -8 app/build.gradle.kts || echo "MISSING app/build.gradle.kts"
          gradle projects --no-daemon
          gradle :app:tasks --all --no-daemon | grep -i -E "unittest|assembleDebug" || echo "no android tasks on :app"
      - name: Unit tests (core logic)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
