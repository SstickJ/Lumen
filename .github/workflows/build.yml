name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # ubuntu-latest already ships the Android SDK with licenses accepted.
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Unit tests (core logic)
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee build.log
      - name: Build debug APK (fallback)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee -a build.log
      # The release build is the one to install: optimised with R8, much smoother than debug.
      - name: Build release APK (install this one)
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee release.log
      - name: Compiler errors only (paste this if the build failed)
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A1 build.log | head -80 || true
      - name: Release build problems (only if release failed)
        if: always()
        run: |
          grep -E "^e: |ERROR:|Missing class|What went wrong" -A2 release.log 2>/dev/null | head -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-and-apk
          path: |
            build.log
            release.log
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
